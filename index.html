<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pip — Karakter Bildirim</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="composer" aria-label="Bildirim oluştur">
        <p class="composer__kicker">v1 · HTML + CSS + JS</p>
        <h1 class="composer__title">Karakter bildirimi getirir.</h1>
        <p class="composer__lead">
          Bildirim bir toaster gibi seçtiğin köşede durur. Pip oraya göre
          gelir, ağırlığına göre sürükler; kapanırken de geri gelip götürür.
        </p>

        <label class="field">
          <span>Başlık</span>
          <input
            id="title-input"
            type="text"
            maxlength="80"
            placeholder="örn. Yeni mesaj"
            value="Toplantı hatırlatması"
          />
        </label>

        <label class="field">
          <span>Mesaj</span>
          <textarea id="body-input" rows="5" placeholder="Bildirim metnini yaz…">Tasarım incelemesi 10 dakika içinde başlıyor.</textarea>
        </label>

        <p class="effort-preview" id="effort-preview" aria-live="polite"></p>

        <div class="field">
          <span>Konum</span>
          <div class="placement" role="group" aria-label="Toaster konumu">
            <button type="button" class="placement__cell" data-position="top-left" aria-label="Sol üst"></button>
            <button type="button" class="placement__cell" data-position="top-center" aria-label="Orta üst"></button>
            <button type="button" class="placement__cell" data-position="top-right" aria-label="Sağ üst"></button>
            <button type="button" class="placement__cell" data-position="bottom-left" aria-label="Sol alt"></button>
            <button type="button" class="placement__cell" data-position="bottom-center" aria-label="Orta alt"></button>
            <button type="button" class="placement__cell is-active" data-position="bottom-right" aria-label="Sağ alt"></button>
          </div>
        </div>

        <label class="field">
          <span>Otomatik kapanış (sn)</span>
          <input id="duration-input" type="number" min="0" max="30" step="1" value="5" />
        </label>
        <p class="field-hint">0 yazarsan sadece × ile kapanır — Pip yine gelip alır.</p>

        <div class="presets" role="group" aria-label="Hazır uzunluklar">
          <button type="button" class="preset" data-preset="light">Kısa</button>
          <button type="button" class="preset" data-preset="normal">Orta</button>
          <button type="button" class="preset" data-preset="heavy">Uzun</button>
          <button type="button" class="preset" data-preset="massive">
            Devasa
          </button>
        </div>

        <button type="button" class="send" id="send-btn">
          Pip’i gönder
        </button>
      </aside>

      <main class="stage" id="stage">
        <div class="stage__glow" aria-hidden="true"></div>

        <div class="toaster-layer" aria-live="polite">
          <div class="dock" data-position="top-left"></div>
          <div class="dock" data-position="top-center"></div>
          <div class="dock" data-position="top-right"></div>
          <div class="dock" data-position="bottom-left"></div>
          <div class="dock" data-position="bottom-center"></div>
          <div class="dock" data-position="bottom-right"></div>
        </div>

        <div class="lane" id="lane">
          <div
            class="character"
            id="character"
            data-state="hidden"
            data-effort="normal"
            aria-hidden="true"
          >
            <div class="character__shadow"></div>
            <div class="character__fx" aria-hidden="true">
              <span class="sweat sweat--1"></span>
              <span class="sweat sweat--2"></span>
              <span class="sweat sweat--3"></span>
              <span class="strain-mark strain-mark--1"></span>
              <span class="strain-mark strain-mark--2"></span>
            </div>
            <div class="character__figure">
              <div class="character__leg character__leg--left"></div>
              <div class="character__leg character__leg--right"></div>
              <div class="character__torso">
                <div class="character__arm character__arm--back"></div>
                <div class="character__body"></div>
                <div class="character__arm character__arm--front">
                  <span class="character__hand"></span>
                </div>
                <div class="character__head">
                  <div class="character__hat"></div>
                  <div class="character__face">
                    <span class="character__brow character__brow--l"></span>
                    <span class="character__brow character__brow--r"></span>
                    <span class="character__eye character__eye--l"></span>
                    <span class="character__eye character__eye--r"></span>
                    <span class="character__mouth"></span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
