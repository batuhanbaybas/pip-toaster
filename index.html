<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pip — Karakter Bildirim</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./demo/demo.css" />
  </head>
  <body>
    <div class="app">
      <aside class="composer" aria-label="Bildirim oluştur">
        <p class="composer__kicker">npm · character-notification</p>
        <h1 class="composer__title">Karakter bildirimi getirir.</h1>
        <p class="composer__lead">
          Bildirim bir toaster gibi seçtiğin köşede durur. Pip oraya göre
          gelir, ağırlığına göre sürükler; kapanırken de geri gelip götürür.
        </p>

        <label class="field">
          <span>Başlık</span>
          <input
            id="title-input"
            type="text"
            maxlength="80"
            placeholder="örn. Yeni mesaj"
            value="Toplantı hatırlatması"
          />
        </label>

        <label class="field">
          <span>Mesaj</span>
          <textarea id="body-input" rows="5" placeholder="Bildirim metnini yaz…">Tasarım incelemesi 10 dakika içinde başlıyor.</textarea>
        </label>

        <p class="effort-preview" id="effort-preview" aria-live="polite"></p>

        <div class="field">
          <span>Konum</span>
          <div class="placement" role="group" aria-label="Toaster konumu">
            <button type="button" class="placement__cell" data-position="top-left" aria-label="Sol üst"></button>
            <button type="button" class="placement__cell" data-position="top-center" aria-label="Orta üst"></button>
            <button type="button" class="placement__cell" data-position="top-right" aria-label="Sağ üst"></button>
            <button type="button" class="placement__cell" data-position="bottom-left" aria-label="Sol alt"></button>
            <button type="button" class="placement__cell" data-position="bottom-center" aria-label="Orta alt"></button>
            <button type="button" class="placement__cell is-active" data-position="bottom-right" aria-label="Sağ alt"></button>
          </div>
        </div>

        <label class="field">
          <span>Otomatik kapanış (sn)</span>
          <input id="duration-input" type="number" min="0" max="30" step="1" value="5" />
        </label>
        <p class="field-hint">0 yazarsan sadece × ile kapanır — Pip yine gelip alır.</p>

        <div class="field">
          <span>Görünüm</span>
          <div class="theme-grid">
            <label class="swatch">
              <input id="theme-skin" type="color" value="#f0c4a0" />
              Ten
            </label>
            <label class="swatch">
              <input id="theme-shirt" type="color" value="#3d7a78" />
              Tişört
            </label>
            <label class="swatch">
              <input id="theme-hat" type="color" value="#e07a5f" />
              Şapka
            </label>
            <label class="swatch">
              <input id="theme-boots" type="color" value="#3a2a22" />
              Bot
            </label>
            <label class="swatch">
              <input id="theme-card" type="color" value="#f7f1e6" />
              Kart
            </label>
            <label class="swatch">
              <input id="theme-ink" type="color" value="#2c241c" />
              Yazı
            </label>
          </div>
        </div>

        <label class="field">
          <span>Kart padding (<span id="padding-label">14</span>px)</span>
          <input id="theme-padding" type="range" min="8" max="28" step="1" value="14" />
        </label>
        <label class="field">
          <span>Kart genişliği (<span id="width-label">340</span>px)</span>
          <input id="theme-width" type="range" min="240" max="420" step="10" value="340" />
        </label>
        <label class="field">
          <span>Kenar boşluğu (<span id="offset-label">24</span>px)</span>
          <input id="theme-offset" type="range" min="8" max="48" step="2" value="24" />
        </label>

        <div class="presets" role="group" aria-label="Hazır uzunluklar">
          <button type="button" class="preset" data-preset="light">Kısa</button>
          <button type="button" class="preset" data-preset="normal">Orta</button>
          <button type="button" class="preset" data-preset="heavy">Uzun</button>
          <button type="button" class="preset" data-preset="massive">
            Devasa
          </button>
        </div>

        <button type="button" class="send" id="send-btn">
          Pip’i gönder
        </button>
      </aside>

      <main class="stage" id="stage">
        <div class="stage__glow" aria-hidden="true"></div>
      </main>
    </div>

    <script type="module" src="./demo/demo.js"></script>
  </body>
</html>
